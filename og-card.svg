<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#f7f6f1"/>
  <line x1="72" y1="68" x2="1128" y2="68" stroke="#141413" stroke-width="2"/>
  <text x="72" y="106" fill="#5c5a54" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18">VELRI-INFERENCE.GITHUB.IO</text>
  <text x="1128" y="106" text-anchor="end" fill="#5c5a54" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="18">C23 · KHRONOS SLANG AOT · GPL-3.0</text>
  <line x1="72" y1="126" x2="1128" y2="126" stroke="#d4d2c9" stroke-width="1"/>

  <text x="72" y="232" fill="#141413" font-family="DejaVu Serif, Liberation Serif, Georgia, serif" font-size="74" font-weight="700">Velri</text>
  <text x="72" y="286" fill="#141413" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="25">Native LLM inference engine, C23 compute library, and VTQ trellis quantization.</text>
  <text x="72" y="328" fill="#5c5a54" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="16">CPU (AVX2 · AVX-512 VNNI · ARM64 · RISC-V)  /  Vulkan 1.3 SPIR-V 1.6  /  Zero runtime Python or CUDA</text>

  <line x1="72" y1="382" x2="1128" y2="382" stroke="#141413" stroke-width="1.5"/>

  <text x="72" y="422" fill="#5c5a54" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15">VELRI ENGINE (DECODE64 W8A8)</text>
  <text x="72" y="468" fill="#141413" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="34" font-weight="700">563.2 tok/s</text>
  <text x="72" y="502" fill="#5c5a54" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18">RTX 5070 Ti Vulkan 1.3</text>
  <text x="72" y="528" fill="#5c5a54" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18">61.1 tok/s on Ryzen 9 9950X</text>

  <text x="438" y="422" fill="#5c5a54" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15">VELRI-LIB (9950X, 16 CORES)</text>
  <text x="438" y="468" fill="#141413" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="34" font-weight="700">17.87 TOPS</text>
  <text x="438" y="502" fill="#5c5a54" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18">W8A8 VNNI · 4.20 TFLOPS BF16</text>
  <text x="438" y="528" fill="#5c5a54" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18">2.05 TFLOPS FP64 · Slang AOT</text>

  <text x="804" y="422" fill="#5c5a54" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="15">VTQ v2 (16x256 SUPERTILES)</text>
  <text x="804" y="468" fill="#9b2c15" font-family="DejaVu Sans Mono, Liberation Mono, monospace" font-size="34" font-weight="700">36 / 36 wins</text>
  <text x="804" y="502" fill="#5c5a54" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18">Lower KLD vs EXL3 &amp; GGUF</text>
  <text x="804" y="528" fill="#5c5a54" font-family="DejaVu Sans, Liberation Sans, sans-serif" font-size="18">1,476.9 GB/s (96.4% HBM)</text>

